<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A client-side To-Do List application with CRUD functionality, task filtering and localStorage persistence.">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <header>
            <h1>My To-Do List</h1>

            <p>Organize your tasks and stay productive.</p>
        </header>


        <!-- Create Task -->
        <section class="task-input-section" aria-labelledby="add-task-heading">

            <h2 id="add-task-heading">Add a New Task</h2>

            <form id="task-form">

                <label for="task-input">
                    Task Name
                </label>

                <div class="input-row">

                    <input
                        type="text"
                        id="task-input"
                        placeholder="Enter a new task"
                        autocomplete="off"
                        required>

                    <button type="submit">
                        Add Task
                    </button>

                </div>

            </form>

        </section>


        <!-- Filters -->
        <section class="filter-section" aria-labelledby="filter-heading">

            <h2 id="filter-heading">Filter Tasks</h2>

            <div class="filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>

        </section>


        <!-- Read Tasks -->
        <section aria-labelledby="task-list-heading">

            <h2 id="task-list-heading">My Tasks</h2>

            <ul id="task-list" aria-live="polite">

                <!-- JavaScript creates tasks here -->

            </ul>

            <p id="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>


        <!-- Task Summary -->
        <footer>

            <p id="task-count">
                0 tasks total
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
